// ── WEB AUDIO SFX SYSTEM ──
// ═══════════════════════════════════════════
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
let audioMuted = false;

function ensureAudio() {
  if (!audioCtx) {
    try { audioCtx = new AudioCtx(); } catch(e) { return null; }
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function playSfx(type) {
  if (audioMuted) return;
  const ctx = ensureAudio();
  if (!ctx) return;
  const now = ctx.currentTime;
  const gain = ctx.createGain();
  gain.connect(ctx.destination);

  if (type === 'hit') {
    // Short percussive hit
    const osc = ctx.createOscillator();
    osc.type = 'square';
    osc.frequency.setValueAtTime(200, now);
    osc.frequency.exponentialRampToValueAtTime(80, now + 0.08);
    gain.gain.setValueAtTime(0.15, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
    osc.connect(gain);
    osc.start(now); osc.stop(now + 0.1);
  } else if (type === 'kill') {
    // Pop with slight pitch rise
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(300, now);
    osc.frequency.exponentialRampToValueAtTime(600, now + 0.06);
    gain.gain.setValueAtTime(0.12, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
    osc.connect(gain);
    osc.start(now); osc.stop(now + 0.12);
  } else if (type === 'xp') {
    // Bright chime
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(800, now);
    osc.frequency.exponentialRampToValueAtTime(1200, now + 0.05);
    gain.gain.setValueAtTime(0.06, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
    osc.connect(gain);
    osc.start(now); osc.stop(now + 0.08);
  } else if (type === 'levelup') {
    // Ascending arpeggio
    [0, 0.08, 0.16].forEach((t, i) => {
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime([523, 659, 784][i], now + t);
      g.gain.setValueAtTime(0.15, now + t);
      g.gain.exponentialRampToValueAtTime(0.001, now + t + 0.2);
      osc.connect(g); g.connect(ctx.destination);
      osc.start(now + t); osc.stop(now + t + 0.2);
    });
  } else if (type === 'boss') {
    // Deep rumble + alarm
    const osc = ctx.createOscillator();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(60, now);
    osc.frequency.exponentialRampToValueAtTime(40, now + 0.5);
    gain.gain.setValueAtTime(0.2, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
    osc.connect(gain);
    osc.start(now); osc.stop(now + 0.6);
    // High alarm
    const osc2 = ctx.createOscillator();
    const g2 = ctx.createGain();
    osc2.type = 'square';
    osc2.frequency.setValueAtTime(440, now);
    osc2.frequency.setValueAtTime(520, now + 0.15);
    osc2.frequency.setValueAtTime(440, now + 0.3);
    osc2.frequency.setValueAtTime(520, now + 0.45);
    g2.gain.setValueAtTime(0.1, now);
    g2.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
    osc2.connect(g2); g2.connect(ctx.destination);
    osc2.start(now); osc2.stop(now + 0.6);
  } else if (type === 'nova') {
    // Whoosh explosion
    const bufferSize = ctx.sampleRate * 0.15;
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
    const noise = ctx.createBufferSource();
    noise.buffer = buffer;
    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(2000, now);
    filter.frequency.exponentialRampToValueAtTime(200, now + 0.15);
    gain.gain.setValueAtTime(0.2, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
    noise.connect(filter); filter.connect(gain);
    noise.start(now); noise.stop(now + 0.2);
  } else if (type === 'chain') {
    // Electric crackle
    const osc = ctx.createOscillator();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(2000, now);
    osc.frequency.exponentialRampToValueAtTime(400, now + 0.1);
    gain.gain.setValueAtTime(0.1, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
    osc.connect(gain);
    osc.start(now); osc.stop(now + 0.12);
  } else if (type === 'playerHit') {
    // Dull thud + pain
    const osc = ctx.createOscillator();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(150, now);
    osc.frequency.exponentialRampToValueAtTime(50, now + 0.15);
    gain.gain.setValueAtTime(0.25, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
    osc.connect(gain);
    osc.start(now); osc.stop(now + 0.2);
  } else if (type === 'goldPickup') {
    // Coin jingle
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(1200, now);
    osc.frequency.exponentialRampToValueAtTime(1800, now + 0.04);
    osc.frequency.exponentialRampToValueAtTime(1400, now + 0.08);
    gain.gain.setValueAtTime(0.1, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
    osc.connect(gain);
    osc.start(now); osc.stop(now + 0.12);
  } else if (type === 'purchase') {
    // Register ka-ching
    [0, 0.06].forEach((t, i) => {
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime([1400, 1800][i], now + t);
      g.gain.setValueAtTime(0.12, now + t);
      g.gain.exponentialRampToValueAtTime(0.001, now + t + 0.1);
      osc.connect(g); g.connect(ctx.destination);
      osc.start(now + t); osc.stop(now + t + 0.1);
    });
  } else if (type === 'death') {
    // Descending sadness
    const osc = ctx.createOscillator();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(400, now);
    osc.frequency.exponentialRampToValueAtTime(100, now + 0.5);
    gain.gain.setValueAtTime(0.2, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
    osc.connect(gain);
    osc.start(now); osc.stop(now + 0.6);
  } else if (type === 'victory') {
    // Triumphant fanfare
    [0, 0.12, 0.24, 0.36].forEach((t, i) => {
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime([523, 659, 784, 1047][i], now + t);
      g.gain.setValueAtTime(0.15, now + t);
      g.gain.exponentialRampToValueAtTime(0.001, now + t + 0.25);
      osc.connect(g); g.connect(ctx.destination);
      osc.start(now + t); osc.stop(now + t + 0.25);
    });
  }
}

function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return { gold: 0, totalGold: 0, runs: 0, bestTime: 0, bestKills: 0, bestScore: 0, upgrades: {} };
}
function saveSave(data) {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(data)); } catch(e) {}
}

let saveData = loadSave();

function getMetaLevel(upgradeId) { return saveData.upgrades[upgradeId] || 0; }
function getMetaCost(upgrade) {
  const lvl = getMetaLevel(upgrade.id);
  return Math.floor(upgrade.cost * Math.pow(upgrade.costScale, lvl));
}
function getMetaBonus(stat) {
  let total = 0;
  for (const u of META_UPGRADES) {
    if (u.stat === stat) total += u.value * getMetaLevel(u.id);
  }
  return total;
}

// ── Object Pools ──
class Pool {
  constructor(factory, reset, max = POOL_MAX) {
    this._factory = factory; this._reset = reset; this._max = max;
    this._pool = []; this.active = [];
  }
  get() {
    const obj = this._pool.length > 0 ? this._pool.pop() : this._factory();
    this._reset(obj);
    this.active.push(obj);
    return obj;
  }
  release(obj) {
    const idx = this.active.indexOf(obj);
    if (idx !== -1) { this.active.splice(idx, 1); this._pool.length < this._max && this._pool.push(obj); }
    if (obj.parent) obj.parent.removeChild(obj);
  }
  releaseAll() { while (this.active.length) this.release(this.active[0]); }
}

// ── MOBILE TOUCH CONTROLS (Virtual Joystick) ──
// ═══════════════════════════════════════════
const touch = { active: false, id: null, startX: 0, startY: 0, dx: 0, dy: 0 };
const JOYSTICK_RADIUS = 50;
const JOYSTICK_DEAD = 10;
let joystickGfx = null;
let joystickKnob = null;

function createJoystickVisuals() {
  joystickGfx = new PIXI.Graphics();
  joystickGfx.circle(0, 0, JOYSTICK_RADIUS).fill({ color: 0xffffff, alpha: 0.08 });
  joystickGfx.circle(0, 0, JOYSTICK_RADIUS).stroke({ color: 0xffffff, alpha: 0.2, width: 2 });
  joystickGfx.visible = false;
  hudContainer.addChild(joystickGfx);

  joystickKnob = new PIXI.Graphics();
  joystickKnob.circle(0, 0, 18).fill({ color: 0xffffff, alpha: 0.3 });
  joystickKnob.visible = false;
  hudContainer.addChild(joystickKnob);
}
createJoystickVisuals();

app.canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (state.phase === 'title') { ensureAudio(); resetGame(); return; }
  if (state.phase === 'gameover') { showShop(); return; }
  if (state.phase !== 'playing') return;
  ensureAudio();
  for (const t of e.changedTouches) {
    if (!touch.active) {
      touch.active = true;
      touch.id = t.identifier;
      touch.startX = t.clientX;
      touch.startY = t.clientY;
      touch.dx = 0; touch.dy = 0;
      joystickGfx.x = t.clientX;
      joystickGfx.y = t.clientY;
      joystickGfx.visible = true;
      joystickKnob.x = t.clientX;
      joystickKnob.y = t.clientY;
      joystickKnob.visible = true;
    }
  }
}, { passive: false });

app.canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier === touch.id) {
      touch.dx = t.clientX - touch.startX;
      touch.dy = t.clientY - touch.startY;
      const dist = Math.sqrt(touch.dx * touch.dx + touch.dy * touch.dy);
      const clamp = Math.min(dist, JOYSTICK_RADIUS);
      if (dist > 0) {
        joystickKnob.x = touch.startX + (touch.dx / dist) * clamp;
        joystickKnob.y = touch.startY + (touch.dy / dist) * clamp;
      }
    }
  }
}, { passive: false });

function endTouch(e) {
  for (const t of e.changedTouches) {
    if (t.identifier === touch.id) {
      touch.active = false;
      touch.dx = 0; touch.dy = 0;
      joystickGfx.visible = false;
      joystickKnob.visible = false;
    }
  }
}
app.canvas.addEventListener('touchend', endTouch, { passive: false });
app.canvas.addEventListener('touchcancel', endTouch, { passive: false });

function getTouchInput() {
  if (!touch.active) return { mx: 0, my: 0 };
  const dist = Math.sqrt(touch.dx * touch.dx + touch.dy * touch.dy);
  if (dist < JOYSTICK_DEAD) return { mx: 0, my: 0 };
  return { mx: touch.dx / dist, my: touch.dy / dist };
}

  boss:     { radius: 36, color: 0xff2244, eyeOff: 12, eyeR: 6,   hpMult: 80,  speedMult: 0.35, xpMult: 50, dmgMult: 3.0, goldMult: 50 },
};

function pickEnemyType(timer) {
  const r = Math.random();
  if (timer < 30) return 'swarmer';
  if (timer < 60) return r < 0.7 ? 'swarmer' : 'brute';
  if (timer < 120) {
    if (r < 0.4) return 'swarmer';
    if (r < 0.6) return 'brute';
    if (r < 0.8) return 'dasher';
    return 'ranged';
  }
  if (timer < 240) {
    if (r < 0.3) return 'swarmer';
    if (r < 0.5) return 'brute';
    if (r < 0.65) return 'dasher';
    if (r < 0.8) return 'ranged';
    return 'exploder';
  }
  if (r < 0.2) return 'swarmer';
  if (r < 0.35) return 'brute';
  if (r < 0.5) return 'dasher';
  if (r < 0.7) return 'ranged';
  return 'exploder';
}

// Chest drop visual
const CHEST_TYPES = ['heal', 'gold', 'xpbomb'];
function makeChestGfx() {
  const g = new PIXI.Graphics();
  // Body
  g.roundRect(-8, -6, 16, 12, 2).fill(0xcc8833);
  // Lid
  g.roundRect(-9, -8, 18, 5, 2).fill(0xddaa44);
  // Clasp
  g.circle(0, -1, 2).fill(0xffdd44);
  g.visible = false;
  g._chestType = 'gold'; g._life = 0;
  return g;
}
function resetChest(c) { c.visible = true; c._life = 0; c.scale.set(1); c.alpha = 1; }
const chestPool = new Pool(makeChestGfx, resetChest, 50);

function spawnChest(x, y) {
  const c = chestPool.get();
  c.x = x; c.y = y;
  c._chestType = CHEST_TYPES[Math.floor(Math.random() * CHEST_TYPES.length)];
  c._life = 0;
  entityContainer.addChild(c);
  return c;
}

function collectChest(c) {
  const p = state.player;
  if (c._chestType === 'heal') {
    const healAmt = Math.ceil(p.maxHp * 0.25);
    p.hp = Math.min(p.maxHp, p.hp + healAmt);
    spawnDamageNumber(c.x, c.y - 10, healAmt, 0x44ff88);
    spawnParticles(c.x, c.y, 0x44ff88, 8);
  } else if (c._chestType === 'gold') {
    const goldAmt = 15 + Math.floor(Math.random() * 16);
    state.goldEarned += goldAmt;
    spawnDamageNumber(c.x, c.y - 10, goldAmt, 0xffdd44);
    spawnParticles(c.x, c.y, 0xffdd44, 8);
    playSfx('goldPickup');
  } else if (c._chestType === 'xpbomb') {
    const xpAmt = Math.ceil(p.xpToNext * 0.5);
    p.xp += xpAmt;
    spawnDamageNumber(c.x, c.y - 10, xpAmt, 0xaa88ff);
    spawnParticles(c.x, c.y, 0xaa88ff, 8);
    playSfx('xp');
    if (p.xp >= p.xpToNext) {
      p.xp -= p.xpToNext;
      p.level++;
      p.xpToNext = xpForLevel(p.level);
      showLevelUp();
    }
  }
  playSfx('purchase');
  chestPool.release(c);
}

function updateChests(dt) {
  const p = state.player;
  for (let i = chestPool.active.length - 1; i >= 0; i--) {
    const c = chestPool.active[i];
    c._life += dt;
    // Bob animation
    c.y += Math.sin(c._life * 3) * 0.2;
    // Gentle pulse
    c.scale.set(1 + Math.sin(c._life * 4) * 0.08);
    const dx = p.x - c.x, dy = p.y - c.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < PLAYER_RADIUS + 12) {
      collectChest(c);
      continue;
    }
    // Despawn after 20 seconds
    if (c._life > 20) {
      c.alpha = Math.max(0, 1 - (c._life - 20) / 2);
      if (c._life > 22) chestPool.release(c);
    }
  }
}

const dmgTexts = [];
function spawnDamageNumber(x, y, value, color = 0xffffff) {
  const t = new PIXI.Text({ text: Math.round(value).toString(), style: { fontFamily: 'monospace', fontSize: 16, fill: color, fontWeight: 'bold', stroke: { color: 0x000000, width: 3 } } });
  t.anchor.set(0.5);
  t.x = x + (Math.random() - 0.5) * 10;
  t.y = y;
  t._vy = -60 - Math.random() * 30;
  t._life = 0;
  t._maxLife = 0.6;
  particleContainer.addChild(t);
  dmgTexts.push(t);
}
function updateDamageNumbers(dt) {
  for (let i = dmgTexts.length - 1; i >= 0; i--) {
    const t = dmgTexts[i];
    t._life += dt;
    t.y += t._vy * dt;
    t.alpha = 1 - t._life / t._maxLife;
    if (t._life >= t._maxLife) {
      if (t.parent) t.parent.removeChild(t);
      t.destroy();
      dmgTexts.splice(i, 1);
    }
  }
}

// ── Spawn helpers ──
function spawnEnemy(forceType) {
  const p = state.player;
  const angle = Math.random() * Math.PI * 2;
  const dist = SPAWN_RING_MIN + Math.random() * (SPAWN_RING_MAX - SPAWN_RING_MIN);
  const ex = p.x + Math.cos(angle) * dist;
  const ey = p.y + Math.sin(angle) * dist;
  if (ex < 0 || ex > WORLD_W || ey < 0 || ey > WORLD_H) return null;
  const typeName = forceType || pickEnemyType(state.timer);
  const et = ENEMY_TYPES[typeName];
  const e = enemyPool.get();
  e.x = ex; e.y = ey;
  e._type = typeName;
  e._radius = et.radius;
  e._hp = ENEMY_BASE_HP * state.enemyHpMult * et.hpMult;
  e._maxHp = e._hp;
  e._speed = ENEMY_BASE_SPEED * state.enemySpeedMult * et.speedMult * (0.85 + Math.random() * 0.3);
  e._dmgMult = et.dmgMult;
  e._xpMult = et.xpMult;
  e._goldMult = et.goldMult || 1;
  if (typeName === 'exploder') e._explodeRadius = 60;
  if (typeName === 'boss') { e._isBoss = true; e.scale.set(1); }
  e.clear();
  e.circle(0, 0, et.radius).fill(et.color);
  e.circle(-et.eyeOff, -et.eyeOff * 0.8, et.eyeR).fill(0xffffff);
  e.circle(et.eyeOff, -et.eyeOff * 0.8, et.eyeR).fill(0xffffff);
  e.circle(-et.eyeOff, -et.eyeOff * 0.8, et.eyeR * 0.5).fill(0x111122);
  e.circle(et.eyeOff, -et.eyeOff * 0.8, et.eyeR * 0.5).fill(0x111122);
  if (typeName === 'brute') {
    e.moveTo(-10, -12).lineTo(-14, -22).lineTo(-6, -14).fill(et.color);
    e.moveTo(10, -12).lineTo(14, -22).lineTo(6, -14).fill(et.color);
  }
  if (typeName === 'dasher') {
    e.moveTo(0, -et.radius).lineTo(4, -et.radius + 5).lineTo(-4, -et.radius + 5).fill(0xffcc00);
  }
  if (typeName === 'ranged') {
    e.moveTo(0, -et.radius + 1).lineTo(4, -et.radius + 5).lineTo(0, -et.radius + 9).lineTo(-4, -et.radius + 5).fill(0xddaaff);
  }
  if (typeName === 'exploder') {
    e.circle(0, 0, et.radius * 0.6).fill(0xaaff44);
    e.moveTo(-3, 0).lineTo(3, 0).stroke({ color: 0x111122, width: 2 });
    e.moveTo(0, -3).lineTo(0, 3).stroke({ color: 0x111122, width: 2 });
  }
  if (typeName === 'boss') {
    e.moveTo(-20, -30).lineTo(-15, -42).lineTo(-5, -34).lineTo(0, -45).lineTo(5, -34).lineTo(15, -42).lineTo(20, -30).fill(0xffdd44);
    e.circle(0, 5, 10).fill(0x220000);
    e.circle(-4, 3, 3).fill(0xff0000);
    e.circle(4, 3, 3).fill(0xff0000);
  }
  // Elite enemy roll (8% chance, not boss)
  if (typeName !== 'boss' && Math.random() < 0.08) {
    e._isElite = true;
    e._hp *= 3;
    e._maxHp = e._hp;
    e._speed *= 1.3;
    e._xpMult *= 3;
    e._goldMult *= 3;
    e.scale.set(1.5);
    // Draw elite glow ring
    e.circle(0, 0, et.radius + 4).stroke({ color: 0xffdd44, width: 2, alpha: 0.8 });
  }
  entityContainer.addChild(e);
  return e;
}

// ═══════════════════════════════════════════
// ── WEAPON SYSTEM ──
// ═══════════════════════════════════════════

function getWeaponDamage(w) {
  let dmg = WEAPON_DEFS[w.type].baseDamage;
  const def = WEAPON_DEFS[w.type];
  for (let i = 0; i <= w.level && i < def.levels.length; i++) {
    if (def.levels[i].dmgMult) dmg *= def.levels[i].dmgMult;
  }
  return dmg * state.player.passives.damage * (1 + getMetaBonus('damage'));
}

function getWeaponCooldown(w) {
  let cd = WEAPON_DEFS[w.type].baseCooldown;
  const def = WEAPON_DEFS[w.type];
  for (let i = 0; i <= w.level && i < def.levels.length; i++) {
    if (def.levels[i].cdMult) cd *= def.levels[i].cdMult;
  }
  return cd * state.player.passives.cooldown;
}

function getWeaponProjCount(w) {
  let count = 1;
  const def = WEAPON_DEFS[w.type];
  for (let i = 0; i <= w.level && i < def.levels.length; i++) {
    if (def.levels[i].extraProj) count += def.levels[i].extraProj;
  }
  return count;
}

function getWeaponBounces(w) {
  let bounces = 3;
  const def = WEAPON_DEFS[w.type];
  for (let i = 0; i <= w.level && i < def.levels.length; i++) {
    if (def.levels[i].bounces) bounces = def.levels[i].bounces;
  }
  return bounces;
}

function getWeaponOrbCount(w) {
  let count = 2;
  const def = WEAPON_DEFS[w.type];
  for (let i = 0; i <= w.level && i < def.levels.length; i++) {
    if (def.levels[i].orbCount) count = def.levels[i].orbCount;
  }
  return count;
}

function getWeaponAreaMult(w) {
  let mult = 1;
  const def = WEAPON_DEFS[w.type];
  for (let i = 0; i <= w.level && i < def.levels.length; i++) {
    if (def.levels[i].areaMult) mult *= def.levels[i].areaMult;
  }
  return mult * state.player.passives.area * state.player.area;
}

function weaponHasPierce(w) {
  const def = WEAPON_DEFS[w.type];
  for (let i = 0; i <= w.level && i < def.levels.length; i++) {
    if (def.levels[i].pierce) return true;
  }
  return false;
}

function weaponHasStun(w) {
  const def = WEAPON_DEFS[w.type];
  for (let i = 0; i <= w.level && i < def.levels.length; i++) {
    if (def.levels[i].stun) return true;
  }
  return false;
}

function addWeapon(type) {
  const w = { type, level: 0, cooldown: 0, _orbAngle: 0 };
  state.player.weapons.push(w);
  if (type === 'orbit') rebuildOrbs();
}

function upgradeWeapon(type) {
  const w = state.player.weapons.find(w => w.type === type);
  if (w && w.level < 4) {
    w.level++;
    if (type === 'orbit') rebuildOrbs();
  }
}

// ── Orbit orbs management ──
function rebuildOrbs() {
  orbPool.releaseAll();
  const w = state.player.weapons.find(w => w.type === 'orbit');
  if (!w) return;
  const count = getWeaponOrbCount(w);
  const def = WEAPON_DEFS.orbit;
  let radiusMult = 1;
  for (let i = 0; i <= w.level && i < def.levels.length; i++) {
    if (def.levels[i].radiusMult) radiusMult *= def.levels[i].radiusMult;
  }
  const baseRadius = 70 * radiusMult;
  for (let i = 0; i < count; i++) {
    const orb = orbPool.get();
    orb._angle = (Math.PI * 2 / count) * i;
    orb._radius = baseRadius;
    orb._damage = getWeaponDamage(w);
    orb.clear();
    orb.circle(0, 0, 10).fill(0x44bbff);
    orb.circle(0, 0, 6).fill(0x88ddff);
    entityContainer.addChild(orb);
  }
}

// ── Fire weapon: projectile ──
function fireProjectile(w) {
  const p = state.player;
  let nearest = null, nearDist = Infinity;
  for (const e of enemyPool.active) {
    const dx = e.x - p.x, dy = e.y - p.y;
    const d = dx * dx + dy * dy;
    if (d < nearDist) { nearDist = d; nearest = e; }
  }
  const count = getWeaponProjCount(w);
  const baseAngle = nearest
    ? Math.atan2(nearest.y - p.y, nearest.x - p.x)
    : Math.random() * Math.PI * 2;
  const spread = 0.2;
  const speed = 400;
  const pierce = weaponHasPierce(w);
  for (let i = 0; i < count; i++) {
    const angle = baseAngle + (i - (count - 1) / 2) * spread;
    const proj = projPool.get();
    proj.x = p.x; proj.y = p.y;
    proj._vx = Math.cos(angle) * speed;
    proj._vy = Math.sin(angle) * speed;
    proj._damage = getWeaponDamage(w);
    proj._area = getWeaponAreaMult(w);
    proj._type = 'projectile';
    proj._pierce = pierce;
    proj.scale.set(proj._area);
    proj.clear();
    proj.circle(0, 0, 5).fill(0xffdd44);
    entityContainer.addChild(proj);
  }
}

// ── Fire weapon: nova ──
function fireNova(w) {
  const p = state.player;
  const radius = 100 * getWeaponAreaMult(w);
  const damage = getWeaponDamage(w);
  const stun = weaponHasStun(w);
  const burst = new PIXI.Graphics();
  burst.circle(0, 0, radius).fill({ color: 0xff66aa, alpha: 0.3 });
  burst.circle(0, 0, radius).stroke({ color: 0xff66aa, width: 3 });
  burst.x = p.x; burst.y = p.y;
  entityContainer.addChild(burst);
  let burstLife = 0;
  const burstTick = (ticker) => {
    burstLife += ticker.deltaMS / 1000;
    burst.alpha = 1 - burstLife / 0.3;
    burst.scale.set(1 + burstLife * 0.5);
    if (burstLife > 0.3) { if (burst.parent) burst.parent.removeChild(burst); burst.destroy(); app.ticker.remove(burstTick); }
  };
  app.ticker.add(burstTick);
  for (const e of enemyPool.active) {
    const dx = e.x - p.x, dy = e.y - p.y;
    if (dx * dx + dy * dy < radius * radius) {
      damageEnemy(e, damage, 0xff66aa);
      if (stun) e._stunTimer = Math.max(e._stunTimer, 1.0);
    }
  }
  addShake(5, 0.15);
  playSfx('nova');
}

// ── Fire weapon: chain lightning ──
function fireChain(w) {
  const p = state.player;
  const bounces = getWeaponBounces(w);
  const damage = getWeaponDamage(w);
  const stun = weaponHasStun(w);
  let nearest = null, nearDist = Infinity;
  for (const e of enemyPool.active) {
    const dx = e.x - p.x, dy = e.y - p.y;
    const d = dx * dx + dy * dy;
    if (d < nearDist && d < 400 * 400) { nearDist = d; nearest = e; }
  }
  if (!nearest) return;
  playSfx('chain');
  const hit = new Set();
  let current = nearest;
  let prevX = p.x, prevY = p.y;
  for (let i = 0; i < bounces && current; i++) {
    hit.add(current);
    damageEnemy(current, damage * (1 - i * 0.1), 0x88ddff);
    if (stun) current._stunTimer = Math.max(current._stunTimer, 0.5);
    drawLightning(prevX, prevY, current.x, current.y);
    prevX = current.x; prevY = current.y;
    let nextE = null, nextD = Infinity;
    for (const e of enemyPool.active) {
      if (hit.has(e)) continue;
      const dx = e.x - current.x, dy = e.y - current.y;
      const d = dx * dx + dy * dy;
      if (d < 200 * 200 && d < nextD) { nextD = d; nextE = e; }
    }
    current = nextE;
  }
}

function drawLightning(x1, y1, x2, y2) {
  const g = new PIXI.Graphics();
  g.moveTo(x1, y1);
  const segs = 5;
  for (let i = 1; i < segs; i++) {
    const t = i / segs;
    const mx = x1 + (x2 - x1) * t + (Math.random() - 0.5) * 20;
    const my = y1 + (y2 - y1) * t + (Math.random() - 0.5) * 20;
    g.lineTo(mx, my);
  }
  g.lineTo(x2, y2).stroke({ color: 0x88ddff, width: 3, alpha: 0.9 });
  entityContainer.addChild(g);
  let life = 0;
  const tick = (ticker) => {
    life += ticker.deltaMS / 1000;
    g.alpha = 1 - life / 0.2;
    if (life > 0.2) { if (g.parent) g.parent.removeChild(g); g.destroy(); app.ticker.remove(tick); }
  };
  app.ticker.add(tick);
}

// ── Fire weapon: boomerang ──
function fireBoomerang(w) {
  const p = state.player;
  const count = getWeaponProjCount(w);
  const damage = getWeaponDamage(w);
  const speed = 350;
  for (let i = 0; i < count; i++) {
    const angle = (Math.PI * 2 / count) * i + Math.random() * 0.3;
    const proj = projPool.get();
    proj.x = p.x; proj.y = p.y;
    proj._originX = p.x; proj._originY = p.y;
    proj._vx = Math.cos(angle) * speed;
    proj._vy = Math.sin(angle) * speed;
    proj._damage = damage;
    proj._area = getWeaponAreaMult(w);
    proj._type = 'boomerang';
    proj._boomerang = true;
    proj._boomPhase = 0;
    proj._boomAngle = angle;
    proj._boomDist = 180;
    proj._pierce = true;
    proj.scale.set(proj._area * 1.2);
    proj.clear();
    proj.moveTo(-8, 0).lineTo(0, -4).lineTo(8, 0).lineTo(0, 4).fill(0xff8844);
    entityContainer.addChild(proj);
  }
}

// ── Fire weapon: ground fire ──
function fireGroundFire(w) {
  const p = state.player;
  const damage = getWeaponDamage(w);
  let widthMult = 1, durationMult = 1;
  const def = WEAPON_DEFS.groundfire;
  for (let i = 0; i <= w.level && i < def.levels.length; i++) {
    if (def.levels[i].widthMult) widthMult *= def.levels[i].widthMult;
    if (def.levels[i].durationMult) durationMult *= def.levels[i].durationMult;
  }
  const radius = 16 * widthMult * state.player.passives.area;
  const duration = 2.5 * durationMult;
  const fire = firePool.get();
  fire.x = p.x; fire.y = p.y;
  fire._damage = damage;
  fire._radius = radius;
  fire._maxLife = duration;
  fire.clear();
  fire.circle(0, 0, radius).fill({ color: 0xff4400, alpha: 0.5 });
  fire.circle(0, 0, radius * 0.6).fill({ color: 0xff8800, alpha: 0.4 });
  entityContainer.addChild(fire);
}

// ── Damage enemy helper ──
function damageEnemy(e, damage, color) {
  e._hp -= damage;
  spawnDamageNumber(e.x, e.y - e._radius, damage, color || 0xffdd44);
  spawnParticles(e.x, e.y, ENEMY_TYPES[e._type]?.color || 0xff6644, 3);
  playSfx('hit');
  if (e._hp <= 0) {
    killEnemy(e);
  }
}

function killEnemy(e) {
  // Kill combo
  state.combo++;
  state.comboTimer = 2.0;
  if (state.combo > state.comboBestThisRun) state.comboBestThisRun = state.combo;
  const comboMult = Math.min(state.combo, 10);
  const xpVal = Math.ceil((1 + Math.floor(state.timer / 30)) * e._xpMult * (1 + (comboMult - 1) * 0.1));
  spawnXp(e.x, e.y, xpVal);
  // Drop gold (combo boosts gold value)
  const goldVal = Math.max(1, Math.ceil(e._goldMult * (1 + state.timer / 120) * (1 + (comboMult - 1) * 0.15)));
  if (Math.random() < 0.4 || e._isBoss || e._isElite) {
    spawnGold(e.x, e.y, goldVal);
  }
  // Treasure chest drop
  if (e._isElite || (e._isBoss) || Math.random() < 0.02) {
    spawnChest(e.x, e.y);
  }
  spawnParticles(e.x, e.y, ENEMY_TYPES[e._type]?.color || 0xff4444, 6);
  playSfx('kill');
  // Exploder detonation
  if (e._type === 'exploder') {
    const radius = e._explodeRadius;
    const p = state.player;
    const dx = p.x - e.x, dy = p.y - e.y;
    if (dx * dx + dy * dy < radius * radius) {
      const dmg = Math.max(1, Math.round(ENEMY_DAMAGE * 2) - p.armor);
      p.hp -= dmg;
      p.damageCooldown = ENEMY_DAMAGE_COOLDOWN;
      addShake(6, 0.2);
      spawnParticles(p.x, p.y, 0xff4444, 6);
      playSfx('playerHit');
      if (p.hp <= 0) { showGameOver(false); return; }
    }
    spawnParticles(e.x, e.y, 0x44ff44, 12);
    for (const other of enemyPool.active) {
      if (other === e) continue;
      const odx = other.x - e.x, ody = other.y - e.y;
      if (odx * odx + ody * ody < radius * radius) {
        other._hp -= 20;
        if (other._hp <= 0) killEnemy(other);
      }
    }
    addShake(5, 0.2);
  }
  if (e._isElite) {
    addShake(6, 0.2);
    spawnParticles(e.x, e.y, 0xffdd44, 12);
    playSfx('levelup');
  }
  if (e._isBoss) {
    state.bossDefeated = true;
    addShake(12, 0.5);
    spawnParticles(e.x, e.y, 0xffdd44, 30);
    for (let i = 0; i < 15; i++) {
      spawnXp(e.x + (Math.random() - 0.5) * 60, e.y + (Math.random() - 0.5) * 60, 5);
    }
    for (let i = 0; i < 8; i++) {
      spawnGold(e.x + (Math.random() - 0.5) * 60, e.y + (Math.random() - 0.5) * 60, 10);
    }
  } else {
    addShake(e._type === 'brute' ? 4 : 2, e._type === 'brute' ? 0.14 : 0.08);
  }
  state.player.kills++;
  enemyPool.release(e);
}

// ── Update weapons ──
function updateWeapons(dt) {
  const p = state.player;
  for (const w of p.weapons) {
    if (w.type === 'orbit') continue;
    w.cooldown -= dt;
    if (w.cooldown <= 0 && enemyPool.active.length > 0) {
      const cd = getWeaponCooldown(w);
      w.cooldown = cd;
      if (w.type === 'projectile') fireProjectile(w);
      else if (w.type === 'nova') fireNova(w);
      else if (w.type === 'chain') fireChain(w);
      else if (w.type === 'boomerang') fireBoomerang(w);
      else if (w.type === 'groundfire') fireGroundFire(w);
    }
  }
}

function updateOrbs(dt) {
  const p = state.player;
  const w = p.weapons.find(w => w.type === 'orbit');
  if (!w) return;
  w._orbAngle = (w._orbAngle || 0) + dt * 2.5;
  const damage = getWeaponDamage(w);
  const count = orbPool.active.length;
  for (let i = 0; i < orbPool.active.length; i++) {
    const orb = orbPool.active[i];
    const baseAngle = (Math.PI * 2 / count) * i + w._orbAngle;
    orb.x = p.x + Math.cos(baseAngle) * orb._radius;
    orb.y = p.y + Math.sin(baseAngle) * orb._radius;
    orb._damage = damage;
    orb._dmgCd -= dt;
    if (orb._dmgCd <= 0) {
      for (const e of enemyPool.active) {
        const dx = orb.x - e.x, dy = orb.y - e.y;
        if (dx * dx + dy * dy < (12 + e._radius) * (12 + e._radius)) {
          damageEnemy(e, damage, 0x44bbff);
          orb._dmgCd = 0.3;
          break;
        }
      }
    }
  }
}

function generateLevelUpChoices() {
  const p = state.player;
  const upgradeable = p.weapons.filter(w => w.level < 4);
  const ownedTypes = new Set(p.weapons.map(w => w.type));
  const newWeapons = Object.keys(WEAPON_DEFS).filter(t => !ownedTypes.has(t));
  const pool = [];
  for (const w of upgradeable) {
    const def = WEAPON_DEFS[w.type];
    const nextLevel = def.levels[w.level + 1];
    pool.push({
      id: `weapon_${w.type}`,
      name: `${def.name} Lv${w.level + 2}`,
      desc: nextLevel.desc,
      icon: def.icon,
      color: def.color,
      isWeaponUpgrade: true,
      weaponType: w.type,
    });
  }
  if (p.weapons.length < MAX_WEAPONS) {
    for (const t of newWeapons) {
      const def = WEAPON_DEFS[t];
      pool.push({
        id: `weapon_new_${t}`,
        name: def.name,
        desc: def.desc,
        icon: def.icon,
        color: def.color,
        isNewWeapon: true,
        weaponType: t,
      });
    }
  }
  for (const pu of PASSIVE_UPGRADES) {
    pool.push({ ...pu, isPassive: true });
  }
  const shuffled = pool.sort(() => Math.random() - 0.5);
  return shuffled.slice(0, 3);
}

    descText.anchor.set(0.5);

    keyLabel.x = cardW / 2; keyLabel.y = cardH - 30;

    card.on('pointerdown', () => selectUpgrade(i));

    levelUpCards.push(card);
  });
}

function selectUpgrade(index) {
  const choice = levelUpChoices[index];
  if (!choice) return;
  if (choice.isNewWeapon) {
    addWeapon(choice.weaponType);
  } else if (choice.isWeaponUpgrade) {
    upgradeWeapon(choice.weaponType);
  } else if (choice.isPassive) {
    choice.apply(state.player.passives, state.player);
  }
  state.upgradeHistory.push(choice.id);
  uiContainer.removeChildren();
  state.phase = 'playing';
}

// ── Game Over UI ──
function showGameOver(won) {
  state.phase = 'gameover';
  uiContainer.removeChildren();

  // Calculate score and gold
  const elapsed = Math.min(state.timer, GAME_DURATION);
  const score = state.player.kills * 10 + state.player.level * 50 + (won ? 2000 : 0) + (state.bossDefeated ? 1000 : 0);
  state.runScore = score;

  playSfx(won ? 'victory' : 'death');

  // Update save data
  saveData.runs++;
  saveData.gold += state.goldEarned;
  saveData.totalGold += state.goldEarned;
  if (elapsed > saveData.bestTime) saveData.bestTime = elapsed;
  if (state.player.kills > saveData.bestKills) saveData.bestKills = state.player.kills;
  if (score > saveData.bestScore) saveData.bestScore = score;
  saveSave(saveData);

  const overlay = new PIXI.Graphics();
  overlay.rect(0, 0, app.screen.width, app.screen.height).fill({ color: 0x000000, alpha: 0.7 });
  uiContainer.addChild(overlay);

  const titleStr = won ? 'YOU SURVIVED!' : 'GAME OVER';
  const titleColor = won ? 0x44ff88 : 0xff4444;
  const title = new PIXI.Text({ text: titleStr, style: { fontFamily: 'monospace', fontSize: Math.min(48, app.screen.width / 10), fill: titleColor, fontWeight: 'bold' } });

  const mins = Math.floor(elapsed / 60);

  const weaponList = state.player.weapons.map(w => `${WEAPON_DEFS[w.type].name} Lv${w.level + 1}`).join(', ');
  const stats = [
    `Time: ${mins}:${secs.toString().padStart(2, '0')} / 10:00`,

    `Weapons: ${weaponList || 'None'}`,

  const statsText = new PIXI.Text({ text: stats, style: { fontFamily: 'monospace', fontSize: Math.min(18, app.screen.width / 26), fill: 0xcccccc, align: 'center', lineHeight: 26 } });
  statsText.anchor.set(0.5);

// ── Reset Game ──
function resetGame() {
  enemyPool.releaseAll();
  projPool.releaseAll();
  xpPool.releaseAll();
  particlePool.releaseAll();
  firePool.releaseAll();
  orbPool.releaseAll();
  goldPool.releaseAll();

  // Apply meta bonuses
  const metaMaxHp = PLAYER_MAX_HP + getMetaBonus('maxHp');
  const metaSpeed = PLAYER_SPEED * (1 + getMetaBonus('speed'));
  const metaMagnet = XP_MAGNET_RANGE * (1 + getMetaBonus('magnet'));

  Object.assign(state.player, {
    x: WORLD_W / 2, y: WORLD_H / 2,
    hp: metaMaxHp, maxHp: metaMaxHp,
    xp: 0, level: 1, xpToNext: xpForLevel(1),
    damageCooldown: 0,
    speed: metaSpeed,
    magnetRange: metaMagnet,
    area: 1.0, armor: getMetaBonus('armor'), kills: 0, _regen: 0,
    weapons: [],
    passives: {
      damage: 1, speed: 1, area: 1, cooldown: 1, maxHp: 0, armor: getMetaBonus('armor'), magnetRange: 1, regen: getMetaBonus('regen'),
    },
  });
  addWeapon('projectile');
  state.timer = 0;
  state.spawnTimer = 0;
  state.spawnRate = 1.5;
  state.enemyHpMult = 1;
  state.enemySpeedMult = 1;
  state.waveNumber = 0;
  state.upgradeHistory = [];
  state.screenShake = 0;
  state.shakeIntensity = 0;
  state.bossSpawned = false;
  state.bossDefeated = false;
  state.goldEarned = 0;
  state.runScore = 0;
  state.combo = 0;
  state.comboTimer = 0;
  state.comboBestThisRun = 0;
  chestPool.releaseAll();
  playerGfx.x = state.player.x;
  playerGfx.y = state.player.y;
  uiContainer.removeChildren();
  state.phase = 'playing';
}

  if (state.phase === 'title' && e.code === 'Space') { ensureAudio(); resetGame(); return; }
  if (state.phase === 'gameover' && e.code === 'Space') { showShop(); return; }
  if (state.phase === 'shop' && e.code === 'Space') { resetGame(); return; }
  if (state.phase === 'shop' && (e.code === 'KeyR')) {
    saveData = { gold: 0, totalGold: 0, runs: 0, bestTime: 0, bestKills: 0, bestScore: 0, upgrades: {} };
    saveSave(saveData);
    showShop();

  }
  if (state.phase === 'levelup') {
    if (e.code === 'Digit1' || e.code === 'Numpad1') selectUpgrade(0);
    if (e.code === 'Digit2' || e.code === 'Numpad2') selectUpgrade(1);
    if (e.code === 'Digit3' || e.code === 'Numpad3') selectUpgrade(2);
  }
});

// ═══════════════════════════════════════════
// ── DIFFICULTY SCALING ──
// ═══════════════════════════════════════════
function updateDifficulty(dt) {
  state.timer += dt;
  const t = state.timer;

  if (t < 120) {
    state.spawnRate = Math.max(0.3, 1.5 - t * 0.01);
  } else if (t < 300) {
    state.spawnRate = Math.max(0.15, 0.3 - (t - 120) * 0.0008);
  } else {
    state.spawnRate = Math.max(0.1, 0.15 - (t - 300) * 0.0002);
  }

  state.enemyHpMult = 1 + t * 0.008 + Math.pow(t / 300, 2) * 2;
  state.enemySpeedMult = 1 + t * 0.002;

  state.spawnTimer -= dt;
  if (state.spawnTimer <= 0) {
    let count = 1 + Math.floor(t / 25);
    if (t > 300) count += 2;
    for (let i = 0; i < count && enemyPool.active.length < 250; i++) spawnEnemy();
    state.spawnTimer = state.spawnRate;
  }

  if (t >= BOSS_TIME && !state.bossSpawned) {
    spawnBoss();
  }
}

// ═══════════════════════════════════════════
// ── MAIN GAME LOOP ──
// ═══════════════════════════════════════════
app.ticker.add((ticker) => {
  const dt = Math.min(ticker.deltaMS / 1000, 0.05);

  if (state.phase !== 'playing') return;

  const p = state.player;

  // ── Player Movement (keyboard + touch) ──
  let mx = 0, my = 0;
  if (keys['KeyW'] || keys['ArrowUp']) my = -1;
  if (keys['KeyS'] || keys['ArrowDown']) my = 1;
  if (keys['KeyA'] || keys['ArrowLeft']) mx = -1;
  if (keys['KeyD'] || keys['ArrowRight']) mx = 1;
  // Touch joystick input
  const touchInput = getTouchInput();
  if (touchInput.mx !== 0 || touchInput.my !== 0) {
    mx = touchInput.mx;
    my = touchInput.my;
  }
  if (mx !== 0 && my !== 0 && !touch.active) { mx *= 0.7071; my *= 0.7071; }
  const effectiveSpeed = p.speed * p.passives.speed;
  p.x += mx * effectiveSpeed * dt;
  p.y += my * effectiveSpeed * dt;
  p.x = Math.max(PLAYER_RADIUS, Math.min(WORLD_W - PLAYER_RADIUS, p.x));
  p.y = Math.max(PLAYER_RADIUS, Math.min(WORLD_H - PLAYER_RADIUS, p.y));
  playerGfx.x = p.x;
  playerGfx.y = p.y;

  // Player flash on damage
  if (p.damageCooldown > 0) {
    p.damageCooldown -= dt;
    playerGfx.alpha = (Math.floor(p.damageCooldown * 10) % 2 === 0) ? 0.5 : 1;
  } else {
    playerGfx.alpha = 1;
  }

  // Regen (passive + meta)
  const totalRegen = p.passives.regen;
  if (totalRegen > 0) {
    p.hp = Math.min(p.maxHp, p.hp + totalRegen * dt);
  }

  // Effective armor
  p.armor = p.passives.armor;
  p.magnetRange = XP_MAGNET_RANGE * p.passives.magnetRange * (1 + getMetaBonus('magnet'));

  // ── Difficulty & Spawning ──
  updateDifficulty(dt);

  // ── Check win condition ──
  if (state.timer >= GAME_DURATION) {
    showGameOver(true);
    return;
  }

  // ── Update Weapons ──
  updateWeapons(dt);
  updateOrbs(dt);

  // ── Update projectiles ──
  for (let i = projPool.active.length - 1; i >= 0; i--) {
    const proj = projPool.active[i];
    proj._life += dt;

    if (proj._boomerang) {
      proj._boomPhase += dt;
      const totalTime = 1.2;
      if (proj._boomPhase > totalTime) {
        projPool.release(proj);
        continue;
      }
      const t = proj._boomPhase / totalTime;
      const speed = 350;
      if (t < 0.4) {
        proj.x += proj._vx * dt;
        proj.y += proj._vy * dt;
      } else {
        const dx = state.player.x - proj.x;
        const dy = state.player.y - proj.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist > 10) {
          proj.x += (dx / dist) * speed * 1.5 * dt;
          proj.y += (dy / dist) * speed * 1.5 * dt;
        } else {
          projPool.release(proj);
          continue;
        }
      }
      proj.rotation += dt * 12;
    } else if (proj._enemyProj) {
      proj.x += proj._vx * dt;
      proj.y += proj._vy * dt;
      if (proj._life > 3) { projPool.release(proj); continue; }
      const dx = proj.x - p.x, dy = proj.y - p.y;
      if (dx * dx + dy * dy < (PLAYER_RADIUS + 5) * (PLAYER_RADIUS + 5)) {
        const dmg = Math.max(1, Math.round(proj._damage) - p.armor);
        p.hp -= dmg;
        p.damageCooldown = ENEMY_DAMAGE_COOLDOWN;
        addShake(4, 0.12);
        spawnParticles(p.x, p.y, 0xff4444, 4);
        playSfx('playerHit');
        projPool.release(proj);
        if (p.hp <= 0) { showGameOver(false); return; }
        continue;
      }
      continue;
    } else {
      if (proj._life > 1.2 || proj.x < -50 || proj.x > WORLD_W + 50 || proj.y < -50 || proj.y > WORLD_H + 50) {
        projPool.release(proj);
        continue;
      }
      proj.x += proj._vx * dt;
      proj.y += proj._vy * dt;
    }

    // Check collision with enemies (player projectiles)
    const projR = 5 * (proj._area || 1);
    for (let j = enemyPool.active.length - 1; j >= 0; j--) {
      const e = enemyPool.active[j];
      if (proj._pierce && proj._pierceHit && proj._pierceHit.has(e)) continue;
      const dx = proj.x - e.x, dy = proj.y - e.y;
      const dist = dx * dx + dy * dy;
      const hitR = projR + e._radius;
      if (dist < hitR * hitR) {
        damageEnemy(e, proj._damage, WEAPON_DEFS[proj._type]?.color || 0xffdd44);
        if (proj._pierce) {
          if (proj._pierceHit) proj._pierceHit.add(e);
        } else {
          projPool.release(proj);
          break;
        }
      }
    }
  }

  // ── Update fire zones ──
  for (let i = firePool.active.length - 1; i >= 0; i--) {
    const fire = firePool.active[i];
    fire._life += dt;
    fire._dmgCd -= dt;
    fire.alpha = 0.5 * (1 - fire._life / fire._maxLife);
    if (fire._life >= fire._maxLife) {
      firePool.release(fire);
      continue;
    }
    if (fire._dmgCd <= 0) {
      fire._dmgCd = 0.3;
      for (const e of enemyPool.active) {
        const dx = e.x - fire.x, dy = e.y - fire.y;
        if (dx * dx + dy * dy < (fire._radius + e._radius) * (fire._radius + e._radius)) {
          damageEnemy(e, fire._damage, 0xff4400);
        }
      }
    }
  }

  // ── Update enemies ──
  for (let i = enemyPool.active.length - 1; i >= 0; i--) {
    const e = enemyPool.active[i];
    if (!e.visible) continue;
    const dx = p.x - e.x, dy = p.y - e.y;
    const dist = Math.sqrt(dx * dx + dy * dy);

    if (e._stunTimer > 0) {
      e._stunTimer -= dt;
      e.alpha = 0.5 + Math.sin(state.timer * 20) * 0.3;
      e._damageCd -= dt;
      continue;
    }
    e.alpha = 1;

    // Elite pulsing scale
    if (e._isElite) {
      e._eliteGlow += dt;
      const pulse = 1.5 + Math.sin(e._eliteGlow * 4) * 0.1;
      e.scale.set(pulse);
    }

    // Boss behavior
    if (e._isBoss) {
      e._bossChargeCd -= dt;
      const hpRatio = e._hp / e._maxHp;
      if (hpRatio < 0.3) e._bossPhase = 2;
      else if (hpRatio < 0.6) e._bossPhase = 1;

      if (dist > 50) {
        const spd = e._speed * (1 + e._bossPhase * 0.3);
        e.x += (dx / dist) * spd * dt;
        e.y += (dy / dist) * spd * dt;
      }

      if (e._bossChargeCd <= 0) {
        e._bossChargeCd = 4 - e._bossPhase;
        const projCount = 8 + e._bossPhase * 4;
        for (let j = 0; j < projCount; j++) {
          const angle = (Math.PI * 2 / projCount) * j;
          const bp = projPool.get();
          bp.x = e.x; bp.y = e.y;
          bp._vx = Math.cos(angle) * 150;
          bp._vy = Math.sin(angle) * 150;
          bp._damage = ENEMY_DAMAGE * 1.5;
          bp._enemyProj = true;
          bp.clear();
          bp.circle(0, 0, 6).fill(0xff2244);
          entityContainer.addChild(bp);
        }
        addShake(4, 0.1);
        spawnParticles(e.x, e.y, 0xff2244, 8);
      }
      if (e._bossPhase >= 1 && Math.random() < 0.005) {
        spawnEnemy('swarmer');
      }
      if (e._bossPhase >= 2 && Math.random() < 0.003) {
        spawnEnemy('exploder');
      }
    }
    else if (e._type === 'dasher') {
      e._dashCd -= dt;
      if (e._dashing) {
        e._dashTimer -= dt;
        e.x += e._dashVx * dt;
        e.y += e._dashVy * dt;
        if (e._dashTimer <= 0) { e._dashing = false; e._dashCd = 2.5 + Math.random(); }
      } else if (e._dashCd <= 0 && dist < 300 && dist > 30) {
        e._dashing = true;
        e._dashTimer = 0.35;
        const dashSpd = e._speed * 5;
        e._dashVx = (dx / dist) * dashSpd;
        e._dashVy = (dy / dist) * dashSpd;
        e._dashCd = 3;
        spawnParticles(e.x, e.y, 0xff8800, 3);
      } else if (dist > 1) {
        e.x += (dx / dist) * e._speed * dt;
        e.y += (dy / dist) * e._speed * dt;
      }
    }
    else if (e._type === 'ranged') {
      e._shootCd -= dt;
      const preferredDist = 200;
      if (dist < preferredDist - 30) {
        e.x -= (dx / dist) * e._speed * 1.2 * dt;
        e.y -= (dy / dist) * e._speed * 1.2 * dt;
      } else if (dist > preferredDist + 50) {
        e.x += (dx / dist) * e._speed * dt;
        e.y += (dy / dist) * e._speed * dt;
      }
      if (e._shootCd <= 0 && dist < 350) {
        e._shootCd = 2.0 + Math.random();
        const bp = projPool.get();
        bp.x = e.x; bp.y = e.y;
        const spd = 180;
        bp._vx = (dx / dist) * spd;
        bp._vy = (dy / dist) * spd;
        bp._damage = ENEMY_DAMAGE * e._dmgMult;
        bp._enemyProj = true;
        bp.clear();
        bp.circle(0, 0, 5).fill(0xaa44ff);
        entityContainer.addChild(bp);
      }
    }
    else if (e._type === 'exploder') {
      if (dist > 1) {
        e.x += (dx / dist) * e._speed * dt;
        e.y += (dy / dist) * e._speed * dt;
      }
      if (dist < 40) {
        e.alpha = 0.5 + Math.sin(state.timer * 15) * 0.5;
      }
    }
    else if (dist > 1) {
      e.x += (dx / dist) * e._speed * dt;
      e.y += (dy / dist) * e._speed * dt;
    }

    e._damageCd -= dt;

    // Enemy-player collision
    const hitDist = PLAYER_RADIUS + e._radius;
    if (dist < hitDist && e._damageCd <= 0) {
      if (e._type === 'exploder') {
        killEnemy(e);
        continue;
      }
      const dmg = Math.max(1, Math.round(ENEMY_DAMAGE * e._dmgMult) - p.armor);
      p.hp -= dmg;
      p.damageCooldown = ENEMY_DAMAGE_COOLDOWN;
      e._damageCd = ENEMY_DAMAGE_COOLDOWN;
      addShake(e._isBoss ? 8 : e._type === 'brute' ? 6 : 4, e._isBoss ? 0.25 : e._type === 'brute' ? 0.18 : 0.12);
      spawnParticles(p.x, p.y, 0xff4444, e._isBoss ? 8 : e._type === 'brute' ? 6 : 4);
      playSfx('playerHit');
      if (p.hp <= 0) {
        showGameOver(false);
        return;
      }
    }

    e.x = Math.max(e._radius, Math.min(WORLD_W - e._radius, e.x));
    e.y = Math.max(e._radius, Math.min(WORLD_H - e._radius, e.y));
  }

  // ── Update XP gems ──
  for (let i = xpPool.active.length - 1; i >= 0; i--) {
    const gem = xpPool.active[i];
    const dx = p.x - gem.x, dy = p.y - gem.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < XP_COLLECT_RANGE) {
      p.xp += gem._value;
      spawnXpSparkle(gem.x, gem.y);
      playSfx('xp');
      xpPool.release(gem);
      while (p.xp >= p.xpToNext) {
        p.xp -= p.xpToNext;
        p.level++;
        p.xpToNext = xpForLevel(p.level);
        showLevelUp();
        return;
      }
    } else if (dist < p.magnetRange) {
      const speed = XP_MAGNET_SPEED * dt;
      gem.x += (dx / dist) * speed;
      gem.y += (dy / dist) * speed;
    }
  }

  // ── Update gold drops ──
  for (let i = goldPool.active.length - 1; i >= 0; i--) {
    const g = goldPool.active[i];
    g._life += dt;
    // Bob animation
    g.y += Math.sin(g._life * 5) * 0.3;
    const dx = p.x - g.x, dy = p.y - g.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const goldMagnet = p.magnetRange * 0.8;
    if (dist < XP_COLLECT_RANGE) {
      state.goldEarned += g._value;
      playSfx('goldPickup');
      // Gold pickup sparkle
      for (let j = 0; j < 3; j++) {
        const pt = particlePool.get();
        pt.x = g.x; pt.y = g.y;
        pt._vx = (Math.random() - 0.5) * 80;
        pt._vy = -50 - Math.random() * 50;
        pt._life = 0; pt._maxLife = 0.3;
        pt.tint = 0xffdd44;
        particleContainer.addChild(pt);
      }
      goldPool.release(g);
    } else if (dist < goldMagnet) {
      const speed = XP_MAGNET_SPEED * 0.8 * dt;
      g.x += (dx / dist) * speed;
      g.y += (dy / dist) * speed;
    }
    // Despawn after 30 seconds
    if (g._life > 30) goldPool.release(g);
  }

  // ── Update particles ──
  for (let i = particlePool.active.length - 1; i >= 0; i--) {
    const pt = particlePool.active[i];
    pt._life += dt;
    if (pt._life >= pt._maxLife) { particlePool.release(pt); continue; }
    pt.x += pt._vx * dt;
    pt.y += pt._vy * dt;
    pt.alpha = 1 - pt._life / pt._maxLife;
    pt.scale.set(1 - pt._life / pt._maxLife);
  }

  // ── Damage Numbers ──
  updateDamageNumbers(dt);

  // ── Kill Combo Decay ──
  if (state.comboTimer > 0) {
    state.comboTimer -= dt;
    if (state.comboTimer <= 0) {
      state.combo = 0;
      state.comboTimer = 0;
    }
  }

  // ── Update Chests ──
  updateChests(dt);

  // ── Camera ──
  let shakeX = 0, shakeY = 0;
  if (state.screenShake > 0) {
    state.screenShake -= dt;
    shakeX = (Math.random() - 0.5) * state.shakeIntensity * 2;
    shakeY = (Math.random() - 0.5) * state.shakeIntensity * 2;
    state.shakeIntensity *= 0.9;
  }
  worldContainer.x = -p.x + app.screen.width / 2 + shakeX;
  worldContainer.y = -p.y + app.screen.height / 2 + shakeY;

  // ── HUD ──
  updateHUD();
});

// ── Handle window resize ──
window.addEventListener('resize', () => {
  if (state.phase === 'title') showTitle();
  else if (state.phase === 'shop') showShop();
});

// ── Start ──
showTitle();

})();
</script>
</body>
</html>
